<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">판매 준비 점검 순서</title>
  <desc id="desc">판매 대상, 사이트와 권한, 판매자, 콘텐츠와 상품, 교재 배송, 공개와 문의, 구매 후 제공, 남은 조건을 순서대로 점검합니다. 교재 배송은 교재 포함 시 적용하며 미확인 항목은 완료로 처리하지 않습니다.</desc>
  <defs>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#416FFF"/><stop offset="1" stop-color="#244CCC"/></linearGradient>
  </defs>
  <rect width="720" height="960" fill="#F5F8FE"/>
  <path d="M32 28H92" stroke="#416FFF" stroke-width="7"/>
  <g font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" letter-spacing="0">
    <text x="32" y="83" font-size="38" font-weight="700" fill="#172A52">판매 준비, 순서대로 점검</text>
    <text x="32" y="124" font-size="28" fill="#52647E">상품에 적용되는 조건을 골라 확인합니다</text>
    <path d="M68 200V836" fill="none" stroke="#C2D1EF" stroke-width="4"/>
    <g fill="#FFFFFF" stroke="#D9E3F5" stroke-width="2">
      <rect x="104" y="156" width="584" height="78" rx="8"/>
      <rect x="104" y="246" width="584" height="78" rx="8"/>
      <rect x="104" y="336" width="584" height="78" rx="8"/>
      <rect x="104" y="426" width="584" height="78" rx="8"/>
      <rect x="104" y="606" width="584" height="78" rx="8"/>
      <rect x="104" y="696" width="584" height="78" rx="8"/>
      <rect x="104" y="786" width="584" height="78" rx="8"/>
    </g>
    <rect x="104" y="516" width="584" height="78" rx="8" fill="#E2F6EF" stroke="#B5DFD1" stroke-width="2"/>
    <g fill="url(#blue)">
      <rect x="42" y="169" width="52" height="52" rx="8"/><rect x="42" y="259" width="52" height="52" rx="8"/>
      <rect x="42" y="349" width="52" height="52" rx="8"/><rect x="42" y="439" width="52" height="52" rx="8"/>
      <rect x="42" y="619" width="52" height="52" rx="8"/><rect x="42" y="709" width="52" height="52" rx="8"/>
      <rect x="42" y="799" width="52" height="52" rx="8"/>
    </g>
    <rect x="42" y="529" width="52" height="52" rx="8" fill="#14866C"/>
    <g font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="68" y="206">1</text><text x="68" y="296">2</text><text x="68" y="386">3</text><text x="68" y="476">4</text>
      <text x="68" y="566">5</text><text x="68" y="656">6</text><text x="68" y="746">7</text><text x="68" y="836">8</text>
    </g>
    <g font-size="31" font-weight="700" fill="#172A52">
      <text x="124" y="190">판매 대상</text><text x="124" y="280">사이트·플랜·권한</text>
      <text x="124" y="370">판매자 준비</text><text x="124" y="460">콘텐츠·상품</text>
      <text x="124" y="550" fill="#116A56">교재 배송</text><text x="124" y="640">공개·문의</text>
      <text x="124" y="730">구매 후 제공 확인</text><text x="124" y="820">남은 조건 판단</text>
    </g>
    <g font-size="27" fill="#52647E">
      <text x="124" y="220">구성·무료/유료·담당자 정하기</text><text x="124" y="310">대상 사이트와 실제 권한 확인</text>
      <text x="124" y="400">신청·심사·계좌 반영 구분</text><text x="124" y="490">등록과 판매 시작은 별도</text>
      <text x="124" y="580" fill="#116A56">교재 포함 시 재고·배송 점검</text><text x="124" y="670">정책·공개 상태·문의 경로</text>
      <text x="124" y="760">포함한 구성품 각각 확인</text><text x="124" y="850">미확인 항목은 완료 보류</text>
    </g>
    <text x="360" y="923" text-anchor="middle" font-size="29" font-weight="700" fill="#244CCC">문서 점검 ≠ 실제 판매 승인</text>
  </g>
</svg>
